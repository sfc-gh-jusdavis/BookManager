name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff
      - name: Lint with ruff
        run: ruff check .

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bkmng-next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: bkmng-next/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000

  pii-check:
    name: PII Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for company-internal identifiers
        run: |
          set -e
          PATTERN='@snowflake\.com|@sfc\.com'
          # Single allowed line: functional SQL filter excluding internal users
          # from customer-facing query results.
          ALLOWED='backend/app/services/snowflake_service.py'
          MATCHES=$(git grep -nE "$PATTERN" -- ':(exclude)*.lock' ':(exclude)_archive/**' ':(exclude).snowflake/**' || true)
          UNEXPECTED=$(echo "$MATCHES" | grep -vE "^${ALLOWED}:" || true)
          if [ -n "$UNEXPECTED" ]; then
            echo "Unexpected internal identifiers in tracked source:"
            echo "$UNEXPECTED"
            echo ""
            echo "See CONTRIBUTING.md 'Privacy Rules'. Move PII to BKMNG_USERS table"
            echo "or use synthetic placeholders (alice@example.com)."
            exit 1
          fi
          echo "PII scan clean"
